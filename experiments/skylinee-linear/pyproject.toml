[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skylinee-linear"
version = "1.0.0"
description = "Portable verified linear regression with a CLI and local HTTP API"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Corey W. Jarman"}]
license = "Apache-2.0"

[project.optional-dependencies]
train = ["numpy>=1.26,<3"]

[project.scripts]
skylinee-linear = "skylinee_linear.__main__:main"

[tool.setuptools.packages.find]
include = ["skylinee_linear*"]
